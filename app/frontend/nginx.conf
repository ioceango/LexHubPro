# ==============================================================================
# LexHubPro 前端 Nginx 配置
# ------------------------------------------------------------------------------
# 两个关键点：
# 1. SPA 路由必须 fallback 到 index.html，否则直接访问 /history、/report/1
#    这类前端路由会返回 404。
# 2. /api 反向代理到后端服务名，使前端与后端同源，避免额外的 CORS 与
#    跨站 Cookie 配置问题。
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的静态资源可长期缓存；index.html 必须不缓存，
    # 否则发布新版本后用户仍会加载旧的资源清单。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 合同审查接口内部串联两次 AI 调用，耗时可达数分钟。
        # 默认 60s 超时会让请求在后端仍在处理时被网关切断。
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # PDF 上传体积上限与后端 MAX_CONTRACT_FILE_MB 对齐，留出编码余量
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}